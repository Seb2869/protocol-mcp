version: "3.8"

services:
  rarible-mcp:
    build: .
    container_name: rarible-mcp-server
    environment:
      # Provide your API key here. Override in CI with
      # `API_KEY=<new-key> docker compose up -d`.
      RARIBLEPROTOCOL_API_KEY_AUTH: "${API_KEY_AUTH:-b728e874-dd76-42ef-b3aa-e408e5c69bcf}"
    ports:
      - "3030:3030"